<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 홈 화면 앱(PWA) 시작 화면 (2026-10-22): 주소창 없이 전체 화면으로 근무표 앱(/)을 띄운다. 앱 코드는 그대로. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1117">
<meta name="mobile-web-app-capable" content="yes">
<title>근무표</title>
<link rel="manifest" href="/pwa/manifest.json">
<link rel="icon" href="/pwa/icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #0E1117; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<iframe id="app" src="/" title="보안팀 근무표" allow="clipboard-write; fullscreen"></iframe>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/pwa/sw.js", { scope: "/pwa/" });
</script>
</body>
</html>
